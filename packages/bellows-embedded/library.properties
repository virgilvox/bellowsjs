sentence=Header-only audio synthesis, music theory, and sequencing for 32-bit microcontrollers.
paragraph=The DSP core of bellowsjs as a header-only C++17 library. Oscillators, filters, envelopes, drum and physical-modelling voices, effects, plus scales, chords, tunings, euclidean rhythms and a tempo map. Nothing allocates, nothing self-registers: include one header and you link one engine. Targets Cortex-M7, M4 and M33 class parts (Teensy 4.x, Daisy Seed, RP2350, ESP32-S3).
