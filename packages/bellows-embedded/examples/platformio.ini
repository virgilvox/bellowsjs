; Template for building any of these examples with PlatformIO.
;
; Copy an example's .ino to src/main.cpp and its .h alongside, or point
; src_dir at the example folder. Verified: all five examples build and
; link as Teensy 4.1 firmware with this file.
;
; The two build_unflags matter. The Teensy platform still defaults to
; gnu++14 on some releases and the library needs C++17 for inline
; constexpr variables, so the older standard has to be removed rather
; than just overridden.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = https://github.com/virgilvox/bellowsjs.git
build_flags =
  -std=gnu++17
  ; 05_MidiInstrument needs this. Harmless for the others.
  ; board_build.usb_type is ignored by the teensy platform, use the define.
  -D USB_MIDI_SERIAL
  ; Uncomment to trade libm for polynomials: about 2.3 KB off a kick, and
  ; renders stop matching the browser bit for bit.
  ; -D BELLOWS_FAST_MATH=1
build_unflags = -std=gnu++14 -std=gnu++11

[env:teensy41_bringup]
; The board bring-up sketch, examples/00_BringUp: the checklist for the
; first session with a board in hand. Same board and framework as above; it
; gets its own env because it is the one you point src_dir at first and
; because the monitor speed is part of the procedure. Verified to build and
; link as Teensy 4.1 firmware from this directory with:
;
;   PLATFORMIO_SRC_DIR=00_BringUp pio run -e teensy41_bringup -t upload
;   pio device monitor -b 115200
;
; A [platformio] section with src_dir = 00_BringUp does the same thing
; without the variable. Either way the .ino and its header compile together.
; The procedure, the wiring and what each stage means are in
; 00_BringUp/README.md.
platform = teensy
board = teensy41
framework = arduino
lib_deps = https://github.com/virgilvox/bellowsjs.git
monitor_speed = 115200
build_flags =
  -std=gnu++17
  ; board_build.usb_type is silently ignored by the teensy platform, so the
  ; USB descriptor has to be selected with a define. USB_MIDI_SERIAL is what
  ; the env above uses and it still gives you Serial, so keeping the two
  ; envs identical here means one less difference to think about if a sketch
  ; behaves differently between them.
  -D USB_MIDI_SERIAL
build_unflags = -std=gnu++14 -std=gnu++11

[env:daisy_seed]
; The Daisy path HAS now been built end to end, but not through PlatformIO.
; Use examples/daisy_onekick, which is a real linked Daisy Seed firmware
; image built with libDaisy's own Makefile:
;
;   make -C examples/daisy_onekick LIBDAISY_DIR=/path/to/libDaisy
;
; libDaisy is not an Arduino framework and does not ship as a PlatformIO
; library, so this env cannot pull it the way the teensy41 env pulls the
; audio library. It is kept for a sketch that vendors libDaisy itself. The
; env below has NOT been verified; the Makefile has.
;
; Whichever route you take, gnu++17 is required rather than merely
; preferred. libDaisy's core/Makefile defaults to -std=gnu++14, and bellows
; headers use inline constexpr variables, which GCC accepts under gnu++14
; only as a warned extension.
platform = ststm32
board = electrosmith_daisy
framework = stm32cube
build_flags = -std=gnu++17
build_unflags = -std=gnu++14 -std=gnu++11
