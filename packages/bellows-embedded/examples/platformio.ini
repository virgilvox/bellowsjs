; Template for building any of these examples with PlatformIO.
;
; Copy an example's .ino to src/main.cpp and its .h alongside, or point
; src_dir at the example folder. Verified: all five examples build and
; link as Teensy 4.1 firmware with this file.
;
; The two build_unflags matter. The Teensy platform still defaults to
; gnu++14 on some releases and the library needs C++17 for inline
; constexpr variables, so the older standard has to be removed rather
; than just overridden.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = https://github.com/virgilvox/bellowsjs.git
build_flags =
  -std=gnu++17
  ; 05_MidiInstrument needs this. Harmless for the others.
  ; board_build.usb_type is ignored by the teensy platform, use the define.
  -D USB_MIDI_SERIAL
  ; Uncomment to trade libm for polynomials: about 2.3 KB off a kick, and
  ; renders stop matching the browser bit for bit.
  ; -D BELLOWS_FAST_MATH=1
build_unflags = -std=gnu++14 -std=gnu++11

[env:daisy_seed]
; libDaisy is not an Arduino framework, so this env assumes you have the
; Daisy toolchain set up and are using bellows/platform/daisy.h. Left here
; as a placeholder: the Daisy path has NOT been built end to end yet.
platform = ststm32
board = electrosmith_daisy
framework = stm32cube
build_flags = -std=gnu++17
build_unflags = -std=gnu++14 -std=gnu++11
